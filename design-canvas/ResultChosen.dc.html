<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #F7F6F3; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1C1A; }
    a { color: #D9480F; } a:hover { color: #A33A0C; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F6F3; display: flex; flex-direction: column; padding: 56px 24px 28px; box-sizing: border-box;">

  <div style="font-family: 'Architects Daughter', cursive; font-size: 13px; color: #86837C; margin-bottom: 26px;">C refined &middot; score is a row, not a hero</div>

  <div style="font-size: 13px; color: #86837C;">{{brand}}</div>
  <div style="font-size: 17px; font-weight: 600; margin-bottom: 30px;">{{name}}</div>

  <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 18px;">
    <div style="width: 9px; height: 9px; border-radius: 5px; background: {{color}};"></div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 1.4px; color: {{color}};">{{verdictWord}}</div>
    <div style="font-size: 13px; color: #86837C;">for fat loss</div>
  </div>

  <div style="font-size: 31px; font-weight: 600; line-height: 1.26; letter-spacing: -0.6px; text-wrap: pretty;">{{leadA}}<span style="color: {{color}};">{{leadB}}</span>{{leadC}}</div>

  <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #C9C6BF; border-radius: 5px; padding: 14px 16px; margin-top: 30px; gap: 14px;">
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 21px; font-weight: 500;">{{score}}</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #86837C;">/100</span>
      <span style="font-size: 13px; color: #86837C;">&middot; {{grade}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; gap: 3px; align-items: flex-end;">
        <sc-for list="{{segs}}" as="seg" hint-placeholder-count="3">
          <div style="width: 14px; height: {{seg.h}}; background: {{seg.fill}}; border-radius: 1px;"></div>
        </sc-for>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86837C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

  <div style="font-size: 11px; letter-spacing: 1.2px; color: #86837C; margin: 30px 0 15px;">ALSO WORTH KNOWING</div>
  <div style="display: flex; flex-direction: column; gap: 13px;">
    <sc-for list="{{notes}}" as="note" hint-placeholder-count="3">
      <div style="display: flex; gap: 11px; align-items: flex-start;">
        <div style="width: 5px; height: 5px; border-radius: 3px; background: #86837C; margin-top: 8px; flex-shrink: 0;"></div>
        <div style="font-size: 14px; line-height: 1.42;">{{note}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="font-size: 12px; color: #86837C; margin-bottom: 12px;">per {{serving}} serving</div>
  <div style="background: #1C1C1A; color: #F7F6F3; text-align: center; padding: 17px; border-radius: 4px; font-size: 16px; font-weight: 600;">Scan another</div>
</div>
</x-dc>
<script data-dc-script data-props='{"product":{"editor":"enum","options":["biscuit","yogurt"],"default":"biscuit","section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const which = this.props.product ?? 'biscuit';
    const bar = (pct, fill) => ({ h: Math.max(4, Math.round(pct * 22)) + 'px', fill });
    const data = {
      biscuit: {
        brand: 'McVitie’s', name: 'Chocolate Digestives',
        verdictWord: 'CAUTION', color: '#D9480F',
        leadA: '11 g of sugar in a 33 g serving — ', leadB: '22% of your daily cap', leadC: '.',
        score: '43', grade: 'poor', serving: '33 g',
        segs: [bar(17 / 60, '#1C1C1A'), bar(26 / 30, '#1C1C1A'), bar(0, '#D6D3CC')],
        notes: [
          'Ultra-processed (NOVA 4)',
          'Saturated fat is the worst line on the panel',
          'Contains E471, an emulsifier that can carry trans fats',
        ],
      },
      yogurt: {
        brand: 'Fage', name: 'Greek Yogurt 0%',
        verdictWord: 'FITS', color: '#2B8A3E',
        leadA: '18 g of protein for every 100 calories — ', leadB: 'unusually dense', leadC: '.',
        score: '89', grade: 'excellent', serving: '170 g',
        segs: [bar(49 / 60, '#1C1C1A'), bar(1, '#1C1C1A'), bar(1, '#1C1C1A')],
        notes: [
          'Minimally processed (NOVA 1)',
          'Nothing flagged in the ingredients',
          'Two ingredients: milk and cultures',
        ],
      },
    };
    return data[which] ?? data.biscuit;
  }
}
</script>
</body>
</html>
