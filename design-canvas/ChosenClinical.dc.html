<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #08090B; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E8EBEF; }
    a { color: #D6FF3F; } a:hover { color: #E8EBEF; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #08090B; display: flex; flex-direction: column; padding: 56px 24px 28px; box-sizing: border-box;">

  <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 11px; letter-spacing: 1.2px; color: #7B8390; margin-bottom: 26px;">CLINICAL INSTRUMENT</div>

  <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; color: #7B8390;">{{brand}}</div>
  <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; margin-bottom: 30px;">{{name}}</div>

  <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 18px;">
    <div style="width: 9px; height: 9px; border-radius: 5px; background: {{color}};"></div>
    <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 11px; letter-spacing: 1.2px; color: {{color}};">{{verdictWord}}</div>
    <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; color: #7B8390;">for fat loss</div>
  </div>

  <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 27px; line-height: 1.3; letter-spacing: -0.4px; text-wrap: pretty;">{{leadA}}<span style="color: {{color}};">{{leadB}}</span>{{leadC}}</div>

  <div style="display: flex; align-items: center; justify-content: space-between; background: #101318; border: 1px solid #1E232B; border-radius: 4px; padding: 14px 16px; margin-top: 30px; gap: 14px;">
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 21px;">{{score}}</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #7B8390;">/100</span>
      <span style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; color: #7B8390;">&middot; {{grade}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; gap: 3px; align-items: flex-end;">
        <sc-for list="{{segs}}" as="seg" hint-placeholder-count="3">
          <div style="width: 14px; height: {{seg.h}}; background: {{seg.fill}}; border-radius: 1px;"></div>
        </sc-for>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7B8390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

  <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 11px; letter-spacing: 1.2px; color: #7B8390; margin: 30px 0 15px;">ALSO WORTH KNOWING</div>
  <div style="display: flex; flex-direction: column; gap: 13px;">
    <sc-for list="{{notes}}" as="note" hint-placeholder-count="3">
      <div style="display: flex; gap: 11px; align-items: flex-start;">
        <div style="width: 5px; height: 5px; border-radius: 3px; background: #7B8390; margin-top: 8px; flex-shrink: 0;"></div>
        <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.42;">{{note}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; color: #7B8390; margin-bottom: 12px;">per {{serving}} serving</div>
  <div style="background: #E8EBEF; color: #08090B; text-align: center; padding: 17px; border-radius: 4px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px;">Scan another</div>
</div>
</x-dc>
<script data-dc-script data-props='{"product":{"editor":"enum","options":["biscuit","yogurt"],"default":"biscuit","section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const which = this.props.product ?? 'biscuit';
    const INK = '#E8EBEF', DIM = '#2A303A';
    const bar = (pct, on) => ({ h: Math.max(4, Math.round(pct * 22)) + 'px', fill: on ? INK : DIM });
    const data = {
      biscuit: {
        brand: 'McVitie’s', name: 'Chocolate Digestives',
        verdictWord: 'CAUTION', color: '#E8A33D',
        leadA: '11 g of sugar in a 33 g serving — ', leadB: '22% of your daily cap', leadC: '.',
        score: '43', grade: 'poor', serving: '33 g',
        segs: [bar(17 / 60, true), bar(26 / 30, true), bar(0, false)],
        notes: [
          'Ultra-processed (NOVA 4)',
          'Saturated fat is the worst line on the panel',
          'Contains E471, an emulsifier that can carry trans fats',
        ],
      },
      yogurt: {
        brand: 'Fage', name: 'Greek Yogurt 0%',
        verdictWord: 'FITS', color: '#3DD68C',
        leadA: '18 g of protein for every 100 calories — ', leadB: 'unusually dense', leadC: '.',
        score: '89', grade: 'excellent', serving: '170 g',
        segs: [bar(49 / 60, true), bar(1, true), bar(1, true)],
        notes: [
          'Minimally processed (NOVA 1)',
          'Nothing flagged in the ingredients',
          'Two ingredients: milk and cultures',
        ],
      },
    };
    return data[which] ?? data.biscuit;
  }
}
</script>
</body>
</html>
