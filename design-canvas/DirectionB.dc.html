<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #F7F6F3; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1C1A; }
    a { color: #D9480F; } a:hover { color: #A33A0C; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F6F3; display: flex; flex-direction: column; padding: 56px 24px 28px; box-sizing: border-box;">

  <div style="font-family: 'Architects Daughter', cursive; font-size: 13px; color: #86837C; letter-spacing: 0.5px; margin-bottom: 24px;">B &middot; score first</div>

  <div style="font-size: 13px; color: #86837C;">McVitie&#39;s</div>
  <div style="font-size: 17px; font-weight: 600; margin-bottom: 24px;">Chocolate Digestives</div>

  <div style="display: flex; align-items: baseline; gap: 8px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 92px; font-weight: 500; letter-spacing: -4px; line-height: 0.9; color: #D9480F;">43</div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #86837C;">/100</div>
      <div style="font-size: 15px; font-weight: 600; color: #D9480F;">poor</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 30px;">
    <sc-for list="{{bars}}" as="bar" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <span style="color: #1C1C1A;">{{bar.label}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; color: #86837C;">{{bar.readout}}</span>
        </div>
        <div style="height: 6px; background: #E3E1DC; border-radius: 3px; overflow: hidden;">
          <div style="height: 6px; width: {{bar.width}}; background: #1C1C1A;"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 1px; background: #C9C6BF; margin: 28px 0 22px;"></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
    <div style="background: #D9480F; color: #F7F6F3; font-size: 12px; font-weight: 600; letter-spacing: 1px; padding: 6px 11px; border-radius: 3px;">CAUTION</div>
    <div style="font-size: 14px; color: #86837C;">for fat loss</div>
  </div>
  <div style="font-size: 15px; line-height: 1.45; text-wrap: pretty;">11 g sugar &mdash; 22% of your daily cap</div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 2px; margin-bottom: 8px; border-top: 1px solid #C9C6BF;">
    <span style="font-size: 15px;">Why this score?</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86837C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>

  <div style="background: #1C1C1A; color: #F7F6F3; text-align: center; padding: 17px; border-radius: 4px; font-size: 16px; font-weight: 600;">Scan another</div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bars: [
        { label: 'Nutrition',  readout: '17/60', width: '28%' },
        { label: 'Additives',  readout: '26/30', width: '87%' },
        { label: 'Processing', readout: '0/10',  width: '2%'  },
      ],
    };
  }
}
</script>
</body>
</html>
