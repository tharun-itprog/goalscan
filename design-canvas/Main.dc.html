<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #F7F6F3; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1C1A; }
    a { color: #D9480F; } a:hover { color: #A33A0C; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F6F3; display: flex; flex-direction: column; padding: 56px 24px 28px; box-sizing: border-box;">

  <div style="font-family: 'Architects Daughter', cursive; font-size: 13px; color: #86837C; letter-spacing: 0.5px; margin-bottom: 28px;">A · verdict first</div>

  <div style="font-size: 13px; color: #86837C; margin-bottom: 2px;">McVitie&#39;s</div>
  <div style="font-size: 19px; font-weight: 600; margin-bottom: 40px;">Chocolate Digestives</div>

  <div style="font-size: 64px; font-weight: 600; letter-spacing: -2px; line-height: 1; color: {{verdictColor}};">{{verdictWord}}</div>
  <div style="font-size: 15px; color: #86837C; margin-top: 10px;">for your fat-loss goal</div>

  <div style="height: 1px; background: #C9C6BF; margin: 32px 0 28px;"></div>

  <div style="font-size: 22px; font-weight: 600; line-height: 1.35; text-wrap: pretty;">{{leadReason}}</div>
  <div style="font-size: 13px; color: #86837C; margin-top: 12px;">per 33 g serving &middot; 1 biscuit</div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #C9C6BF; border-radius: 4px; padding: 16px 18px; margin-bottom: 14px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-size: 11px; letter-spacing: 1.2px; color: #86837C;">HEALTH SCORE</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500;">43<span style="color: #86837C; font-size: 14px;">/100</span> &nbsp;poor</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86837C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>

  <div style="background: #1C1C1A; color: #F7F6F3; text-align: center; padding: 17px; border-radius: 4px; font-size: 16px; font-weight: 600;">Scan another</div>
</div>
</x-dc>
<script data-dc-script data-props='{"verdict":{"editor":"enum","options":["skip","caution","fits"],"default":"caution","section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.verdict ?? 'caution';
    const map = {
      skip:    { word: 'SKIP',    color: '#C92A2A', lead: '34 g sugar per 100 g — 65% of your daily cap in one sitting' },
      caution: { word: 'CAUTION', color: '#D9480F', lead: '11 g sugar in one biscuit — 22% of your daily cap' },
      fits:    { word: 'FITS',    color: '#2B8A3E', lead: 'Nothing here works against your goal' },
    };
    const m = map[v] ?? map.caution;
    return { verdictWord: m.word, verdictColor: m.color, leadReason: m.lead };
  }
}
</script>
</body>
</html>
