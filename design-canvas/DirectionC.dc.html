<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #F7F6F3; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1C1A; }
    a { color: #D9480F; } a:hover { color: #A33A0C; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F6F3; display: flex; flex-direction: column; padding: 56px 24px 28px; box-sizing: border-box;">

  <div style="font-family: 'Architects Daughter', cursive; font-size: 13px; color: #86837C; letter-spacing: 0.5px; margin-bottom: 28px;">C &middot; reason first</div>

  <div style="font-size: 13px; color: #86837C;">McVitie&#39;s</div>
  <div style="font-size: 17px; font-weight: 600; margin-bottom: 44px;">Chocolate Digestives</div>

  <div style="font-size: 32px; font-weight: 600; line-height: 1.25; letter-spacing: -0.6px; text-wrap: pretty;">
    11 g of sugar in one biscuit. That&#39;s <span style="color: #D9480F;">22% of your daily cap</span>.
  </div>

  <div style="display: flex; gap: 8px; margin-top: 32px;">
    <div style="border: 1px solid #D9480F; color: #D9480F; font-size: 12px; font-weight: 600; letter-spacing: 1px; padding: 7px 12px; border-radius: 3px;">CAUTION</div>
    <div style="border: 1px solid #C9C6BF; color: #86837C; font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 7px 12px; border-radius: 3px;">43/100 poor</div>
  </div>

  <div style="height: 1px; background: #C9C6BF; margin: 34px 0 20px;"></div>

  <div style="font-size: 11px; letter-spacing: 1.2px; color: #86837C; margin-bottom: 16px;">ALSO WORTH KNOWING</div>
  <div style="display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{notes}}" as="note" hint-placeholder-count="3">
      <div style="display: flex; gap: 11px; align-items: flex-start;">
        <div style="width: 5px; height: 5px; border-radius: 3px; background: #86837C; margin-top: 8px; flex-shrink: 0;"></div>
        <div style="font-size: 15px; line-height: 1.4;">{{note}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 2px; margin-bottom: 8px; border-top: 1px solid #C9C6BF;">
    <span style="font-size: 15px;">See the full breakdown</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86837C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>

  <div style="background: #1C1C1A; color: #F7F6F3; text-align: center; padding: 17px; border-radius: 4px; font-size: 16px; font-weight: 600;">Scan another</div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      notes: [
        'Ultra-processed (NOVA 4)',
        'Saturated fat is the worst line on the panel &mdash; 12.5 g per 100 g',
        'Contains E471, an emulsifier that can carry trans fats',
      ],
    };
  }
}
</script>
</body>
</html>
